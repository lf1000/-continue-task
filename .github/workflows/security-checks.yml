name: Security Guardrails

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  semgrep-scan:
    name: Semgrep External URL Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: rules/no-external-url.yaml
        continue-on-error: true

  npm-audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Audit core dependencies
        working-directory: core
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=moderate || true

      - name: Audit extension dependencies
        working-directory: extensions/vscode
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=moderate || true

  security-tests:
    name: Security Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: core
        run: npm ci

      - name: Run security tests
        working-directory: core
        run: npx vitest run --reporter=verbose config/allowlist.vitest.ts config/networkInterceptor.vitest.ts

  build-output-scan:
    name: Scan Build Output for External URLs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run Security Scanner
        run: |
          echo "Verifying air-gapped security configurations..."
          node scripts/scan-build-output.js || true

