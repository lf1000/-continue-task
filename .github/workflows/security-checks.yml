name: Security Guardrails

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  semgrep-scan:
    name: Semgrep External URL Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: rules/no-external-url.yaml

  npm-audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Audit core dependencies
        working-directory: core
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=moderate || true

      - name: Audit extension dependencies
        working-directory: extensions/vscode
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=moderate || true

  build-output-scan:
    name: Scan Build Output for External URLs
    runs-on: ubuntu-latest
    needs: [semgrep-scan]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install and Build
        run: |
          npm ci
          npm run build --if-present

      - name: Grep build output for https://
        run: |
          echo "Scanning build output for external URLs..."
          FOUND=$(grep -rn "https://" extensions/vscode/out/ gui/dist/ binary/out/ 2>/dev/null \
            | grep -v "node_modules" \
            | grep -v "package-lock" \
            | grep -v "127.0.0.1" \
            | grep -v "localhost" \
            || true)
          if [ -n "$FOUND" ]; then
            echo "::error::External URLs found in build output:"
            echo "$FOUND"
            exit 1
          else
            echo "✓ No external URLs found in build output"
          fi

  security-tests:
    name: Security Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: core
        run: npm ci

      - name: Run security tests
        working-directory: core
        run: npx vitest run --reporter=verbose config/allowlist.vitest.ts util/networkInterceptor.vitest.ts
